<!--Build a table listing 4 students and their marks in two subjects with tborder="1"-->
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
    </head>
    <body>
        <table border="1">
            <caption>Midterm Marks</caption>
            <thead>
                <tr>
                    <th scope="col">Name</th>
                    <th scope="col">Maths</th>
                    <th scope="col">Science</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td scope="row">venkat</td>
                    <td>85</td>
                    <td>90</td>
                </tr>
                <tr>
                    <td scope="row">jay</td>
                    <td>92</td>
                    <td>88</td>
                </tr>
                <tr>
                    <td scope="row">Bob</td>
                    <td>78</td>
                    <td>82</td>
                </tr>
                <tr>
                    <td scope="row">karthik</td>
                    <td>95</td>
                    <td>91</td>
                </tr>
            </tbody>
            <tfoot>
                <tr>
                    <td scope="row">Average</td>
                    <td>87.5</td>
                    <td>87.75</td>
                </tr>
        </table>
    </body>
</html>
